services:
  springboot-web:
    image: ${DOCKER_USERNAME}/springboot-web:${SPRINGBOOT_IMAGE_TAG}
    platform: linux/amd64
    container_name: springboot-web
    restart: on-failure

    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "8080"

    environment:
      PROFILE: ${PROFILE}

      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DB: ${MYSQL_DB}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}

      LOG_FILE: ${LOG_FILE}
      LOGGING_FILE_NAME: ${LOGGING_FILE_NAME}

      MAIN_PAGE: ${MAIN_PAGE}

    volumes:
      - ./logs:/var/log/app-logs

    networks:
      - my-network

  flutter-web:
    image: ${DOCKER_USERNAME}/flutter-web:${FLUTTER_IMAGE_TAG}
    platform: linux/amd64
    container_name: flutter-web
    restart: always

    expose:
      - "80"

    networks:
      - my-network

  my-nginx:
    image: nginx:stable
    platform: linux/amd64
    container_name: my-nginx
    restart: on-failure

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /home/ubuntu/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx

    depends_on:
      - flutter-web
      - springboot-web

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - my-network

networks:
  my-network:
    driver: bridge